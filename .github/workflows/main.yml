name: Build (TFHIC)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTFHIC_WITH_ROOT=OFF -DTFHIC_WITH_QT=OFF

      - name: Build
        run: |
          cmake --build build -j

      - name: Smoke run
        run: |
          ./build/bin/export_dndy_json --help
          ./build/bin/blastwave_thermal --help || true
          ./build/bin/predict_light_spectra --help || true

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: |
          docker build -t tfhic:ci .

      - name: Smoke run (container)
        run: |
          docker run --rm tfhic:ci /opt/tfhic/install/bin/export_dndy_json --help
          docker run --rm tfhic:ci /opt/tfhic/install/bin/predict_light_spectra --help
